name: CI

# Every push: the tests, on the Java versions bbrun supports. iconn, regl and DRef come
# from libs/repo until they are on Maven Central.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Build and test
        run: ./gradlew test :bbrun-cli:installDist

      - name: Run the examples that need no service
        run: |
          B=bbrun-cli/build/install/bbrun/bin/bbrun
          $B run examples/quickstart
          $B run examples/reference/testing/_reference/tests
          $B run examples/reference/integration
