plugins {
    id 'application'
}

application {
    mainClass = 'org.bbrun.cli.Main'
    applicationName = 'bbrun'
}

dependencies {
    implementation project(':bbrun-core')

    // DRef types used by the `models` command
    implementation "dev.dref:dref-validator:${drefVersion}"

    // Picocli CLI framework
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // Terminal & Progress
    implementation 'org.jline:jline:3.26.1'

    // JSON
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.54'

    // The connectors log through SLF4J; the CLI reports on its own, so their log is dropped
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.13'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest {
        attributes 'Main-Class': 'org.bbrun.cli.Main'
    }
}
