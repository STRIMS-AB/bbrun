org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# The vendored DRef validator's version. DRef is the source of truth for this:
# it must match dref-java's pom.xml, and `verifyDrefVersion` fails the build if
# libs/dref-validator-<this>.jar is not the jar that DRef actually built.
drefVersion=0.1.0

# iconn and regl, which bbrun is built on. Like DRef they are not on Maven Central yet:
# the build takes them from the local Maven repository, else from libs/repo, the copy
# dist/vendor.sh makes of them.
iconnVersion=0.1.0
reglVersion=0.1.0
